<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #fbf7f1; }
      svg { display: block; }
      .title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; fill: #1f1a16; }
      .sub { font-family: 'Inter', sans-serif; font-weight: 400; fill: #877a6e; }
      .panel-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; fill: #1f1a16; }
      .eyebrow { font-family: 'Inter', sans-serif; font-weight: 600; fill: #877a6e; letter-spacing: 1.4px; }
      .item { font-family: 'Inter', sans-serif; font-weight: 500; fill: #1f1a16; }
      .muted { font-family: 'Inter', sans-serif; font-weight: 400; fill: #877a6e; }
      .edge { font-family: 'Inter', sans-serif; font-weight: 500; fill: #574c43; }
      .tag { font-family: 'Inter', sans-serif; font-weight: 600; }
    </style>
  </head>
  <body>
    <svg width="1640" height="1010" viewBox="0 0 1640 1010" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#877a6e" />
        </marker>
        <marker id="arrowSaffron" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1651a" />
        </marker>
      </defs>

      <rect width="1640" height="1010" fill="#fbf7f1" />

      <!-- Heading -->
      <text x="56" y="66" class="title" font-size="34">Lakshya — how the pieces fit together</text>
      <text x="56" y="96" class="sub" font-size="15">
        AI Learning Assistant &amp; Personalized Study Planner · Team RICR-HIM-1083
      </text>

      <!-- ============ BROWSER ============ -->
      <rect x="56" y="140" width="420" height="500" rx="18" fill="#fffdfa" stroke="#e7dcce" stroke-width="1.5" />
      <text x="84" y="176" class="eyebrow" font-size="11">RUNS IN THE BROWSER</text>
      <text x="84" y="206" class="panel-title" font-size="22">React app</text>
      <text x="84" y="230" class="muted" font-size="13">React 19 · Vite · Tailwind · React Router</text>

      <line x1="84" y1="250" x2="448" y2="250" stroke="#e7dcce" stroke-width="1.5" />

      <text x="84" y="278" class="eyebrow" font-size="11">SCREENS</text>
      <text x="84" y="304" class="item" font-size="14">Sign in / Sign up</text>
      <text x="84" y="330" class="item" font-size="14">Set a goal — subject, deadline, hours a day</text>
      <text x="84" y="356" class="item" font-size="14">Diagnostic quiz</text>
      <text x="84" y="382" class="item" font-size="14">Study plan — what to do today</text>
      <text x="84" y="408" class="item" font-size="14">Topic page — read up on one topic</text>
      <text x="84" y="434" class="item" font-size="14">Ask a doubt — tutor chat</text>

      <line x1="84" y1="458" x2="448" y2="458" stroke="#e7dcce" stroke-width="1.5" />

      <text x="84" y="486" class="eyebrow" font-size="11">KEPT LIGHT ON PHONES</text>
      <text x="84" y="510" class="muted" font-size="13">Each screen is a separate chunk, fetched</text>
      <text x="84" y="530" class="muted" font-size="13">the first time it is opened.</text>
      <text x="84" y="562" class="muted" font-size="13">3D anatomy models (Three.js) download</text>
      <text x="84" y="582" class="muted" font-size="13">only when a student opens one —</text>
      <text x="84" y="602" class="muted" font-size="13">21 MB of models, none of it up front.</text>

      <!-- ============ API ============ -->
      <rect x="540" y="140" width="560" height="720" rx="18" fill="#fffdfa" stroke="#e7dcce" stroke-width="1.5" />
      <text x="570" y="176" class="eyebrow" font-size="11">OUR SERVER</text>
      <text x="570" y="206" class="panel-title" font-size="22">Express API (Node.js)</text>

      <!-- every request passes through -->
      <rect x="570" y="228" width="500" height="88" rx="12" fill="#f4ede3" stroke="#e7dcce" stroke-width="1.2" />
      <text x="590" y="254" class="eyebrow" font-size="11">EVERY REQUEST GOES THROUGH</text>
      <text x="590" y="280" class="item" font-size="14">Check the JWT → validate the input → load the goal</text>
      <text x="590" y="302" class="muted" font-size="12.5">A student can only ever read their own data.</text>

      <!-- AI-backed -->
      <rect x="570" y="336" width="500" height="176" rx="12" fill="#fffdfa" stroke="#d1651a" stroke-width="1.5" />
      <circle cx="592" cy="364" r="5" fill="#d1651a" />
      <text x="606" y="369" class="tag" font-size="12" fill="#d1651a">ASKS THE AI</text>
      <text x="590" y="398" class="item" font-size="14">Split a subject into topics</text>
      <text x="590" y="398" class="muted" font-size="13" dy="22">Ordered, with what depends on what</text>
      <text x="590" y="452" class="item" font-size="14">Write quiz and mock-test questions</text>
      <text x="590" y="452" class="muted" font-size="13" dy="22">With the explanation for each answer</text>
      <text x="852" y="398" class="item" font-size="14">Answer doubts</text>
      <text x="852" y="398" class="muted" font-size="13" dy="22">Knows the topic being</text>
      <text x="852" y="398" class="muted" font-size="13" dy="40">studied right now</text>

      <!-- deterministic -->
      <rect x="570" y="532" width="500" height="196" rx="12" fill="#fffdfa" stroke="#146b5d" stroke-width="1.5" />
      <circle cx="592" cy="560" r="5" fill="#146b5d" />
      <text x="606" y="565" class="tag" font-size="12" fill="#146b5d">PLAIN CODE — NO AI INVOLVED</text>
      <text x="590" y="594" class="item" font-size="14">Scheduler</text>
      <text x="590" y="594" class="muted" font-size="13" dy="21">Fits topics into the days and hours</text>
      <text x="590" y="594" class="muted" font-size="13" dy="39">actually left. Nothing is scheduled</text>
      <text x="590" y="594" class="muted" font-size="13" dy="57">before what it depends on.</text>
      <text x="852" y="594" class="item" font-size="14">Spaced repetition</text>
      <text x="852" y="594" class="muted" font-size="13" dy="21">Brings a topic back before</text>
      <text x="852" y="594" class="muted" font-size="13" dy="39">it is forgotten</text>
      <text x="590" y="700" class="item" font-size="14">Mastery &amp; progress</text>
      <text x="852" y="700" class="item" font-size="14">Rebuild when you fall behind</text>

      <!-- the point -->
      <rect x="570" y="748" width="500" height="82" rx="12" fill="#dceee9" stroke="#146b5d" stroke-width="1.2" />
      <text x="590" y="776" class="tag" font-size="12" fill="#146b5d">WHY IT IS SPLIT THIS WAY</text>
      <text x="590" y="800" class="item" font-size="13.5">The AI writes the content. Our own code builds the plan.</text>
      <text x="590" y="820" class="muted" font-size="13">So if the AI is unavailable, you can type your topics and still get a plan.</text>

      <!-- ============ DATABASE ============ -->
      <rect x="1164" y="140" width="420" height="286" rx="18" fill="#fffdfa" stroke="#e7dcce" stroke-width="1.5" />
      <text x="1192" y="176" class="eyebrow" font-size="11">STORED</text>
      <text x="1192" y="206" class="panel-title" font-size="22">MongoDB</text>
      <text x="1192" y="230" class="muted" font-size="13">Mongoose · local or Atlas</text>
      <line x1="1192" y1="250" x2="1556" y2="250" stroke="#e7dcce" stroke-width="1.5" />
      <text x="1192" y="278" class="item" font-size="14">users</text>
      <text x="1192" y="278" class="muted" font-size="12.5" dx="120">accounts, hashed passwords</text>
      <text x="1192" y="304" class="item" font-size="14">goals</text>
      <text x="1192" y="304" class="muted" font-size="12.5" dx="120">subject, deadline, topics</text>
      <text x="1192" y="330" class="item" font-size="14">assessments</text>
      <text x="1192" y="330" class="muted" font-size="12.5" dx="120">quizzes and answers</text>
      <text x="1192" y="356" class="item" font-size="14">plans</text>
      <text x="1192" y="356" class="muted" font-size="12.5" dx="120">every version of the schedule</text>
      <text x="1192" y="382" class="item" font-size="14">progress</text>
      <text x="1192" y="382" class="muted" font-size="12.5" dx="120">mastery per topic</text>
      <text x="1192" y="408" class="item" font-size="14">conversations</text>
      <text x="1192" y="408" class="muted" font-size="12.5" dx="120">tutor chat history</text>

      <!-- ============ AI ============ -->
      <rect x="1164" y="458" width="420" height="402" rx="18" fill="#fffdfa" stroke="#e7dcce" stroke-width="1.5" />
      <text x="1192" y="494" class="eyebrow" font-size="11">OUTSIDE SERVICES</text>
      <text x="1192" y="524" class="panel-title" font-size="22">The AI providers</text>
      <line x1="1192" y1="546" x2="1556" y2="546" stroke="#e7dcce" stroke-width="1.5" />

      <rect x="1192" y="566" width="364" height="96" rx="12" fill="#f7e7d6" stroke="#d1651a" stroke-width="1.3" />
      <text x="1212" y="592" class="tag" font-size="11" fill="#d1651a">FIRST CHOICE</text>
      <text x="1212" y="616" class="item" font-size="15">Google Gemini</text>
      <text x="1212" y="640" class="muted" font-size="12.5">gemini-flash-latest · free tier</text>

      <rect x="1192" y="678" width="364" height="96" rx="12" fill="#f4ede3" stroke="#e7dcce" stroke-width="1.3" />
      <text x="1212" y="704" class="tag" font-size="11" fill="#877a6e">IF GEMINI FAILS</text>
      <text x="1212" y="728" class="item" font-size="15">Groq</text>
      <text x="1212" y="752" class="muted" font-size="12.5">llama-3.3-70b · automatic fallback</text>

      <text x="1192" y="806" class="muted" font-size="12.5">If a model is retired or the daily quota</text>
      <text x="1192" y="826" class="muted" font-size="12.5">runs out, the server finds a working one</text>
      <text x="1192" y="846" class="muted" font-size="12.5">on its own instead of failing.</text>

      <!-- ============ ARROWS ============ -->
      <!-- browser <-> api -->
      <line x1="476" y1="352" x2="536" y2="352" stroke="#877a6e" stroke-width="1.8" marker-end="url(#arrow)" />
      <line x1="536" y1="392" x2="476" y2="392" stroke="#877a6e" stroke-width="1.8" marker-end="url(#arrow)" />
      <text x="452" y="330" class="edge" font-size="12.5" text-anchor="start">HTTPS · JSON</text>
      <text x="452" y="424" class="edge" font-size="12.5" text-anchor="start">JWT in the header</text>

      <!-- api -> mongo -->
      <line x1="1100" y1="284" x2="1160" y2="284" stroke="#877a6e" stroke-width="1.8" marker-end="url(#arrow)" />
      <text x="1104" y="266" class="edge" font-size="12.5">read / write</text>

      <!-- api -> ai -->
      <line x1="1100" y1="424" x2="1132" y2="424" stroke="#d1651a" stroke-width="1.8" />
      <line x1="1132" y1="424" x2="1132" y2="612" stroke="#d1651a" stroke-width="1.8" />
      <line x1="1132" y1="612" x2="1188" y2="612" stroke="#d1651a" stroke-width="1.8" marker-end="url(#arrowSaffron)" />
      <text x="1104" y="410" class="edge" font-size="12.5" fill="#d1651a">prompt</text>

      <!-- footer -->
      <text x="56" y="964" class="muted" font-size="12.5">
        Frontend deploys to Vercel · API and database to Render / MongoDB Atlas · the API key never leaves the server
      </text>
    </svg>
  </body>
</html>
