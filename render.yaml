# Render deployment for the Lakshya API.
#
# Committed rather than clicked through a dashboard so the deployment is
# reviewable, reproducible, and the same for whoever redeploys it next.
#
# To use: Render → New → Blueprint → point it at this repository. Render reads
# this file, creates the service, and asks for the values marked sync: false.

services:
  - type: web
    name: lakshya-api
    runtime: node
    plan: free
    region: singapore # closest of Render's regions to the students using this
    rootDir: backend

    # npm ci, not npm install: it installs exactly what the lockfile says and
    # fails loudly if the lockfile and package.json disagree, rather than
    # quietly resolving something different from what was tested.
    buildCommand: npm ci
    startCommand: npm start

    # Render stops sending traffic to an instance that fails this. The endpoint
    # answers 503 when the database is unreachable, so a broken instance is
    # taken out rather than left accepting requests it can only fail.
    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Render provides the port and expects the service to bind to it.
      - key: PORT
        value: 10000

      # sync: false means Render asks for the value and stores it encrypted.
      # None of these ever enter the repository.
      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        # Generated by Render rather than chosen by a person, so it is not
        # something anyone has typed, reused, or pasted into a chat.
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: GEMINI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      # The deployed frontend's origin. Must match exactly — scheme, host, no
      # trailing slash — or the browser blocks every request as a CORS failure.
      - key: CLIENT_ORIGIN
        sync: false
