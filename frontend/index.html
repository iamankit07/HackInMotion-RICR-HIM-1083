<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lakshya builds a study plan around what you actually know and how much time you actually have."
    />
    <title>Lakshya — know what to study next</title>

    <!-- SVG first so the mark stays sharp and follows the reader's theme; the
         PNG is there for browsers that will not take one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <script>
      // Applies a saved theme before the first paint, so the page never flashes
      // one theme and snaps to the other. With no saved choice nothing is set,
      // and the stylesheet's own light default and prefers-color-scheme rule
      // take over — which is why there is no fallback branch here.
      (function () {
        try {
          var stored = localStorage.getItem('lakshya-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {
          /* localStorage blocked — the stylesheet default is correct anyway */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
